name: Оновлення бази ФДМУ

on:
  schedule:
    # щопонеділка о 06:00 UTC (09:00 за Києвом)
    - cron: '0 6 * * 1'
  workflow_dispatch:        # ручний запуск кнопкою

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Оновити базу
        run: python3 fdmu_autoupdate.py

      - name: Закомітити зміни
        run: |
          git config user.name  "fdmu-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add calc_data.json archive_calc_data.json processed_files.json executor_merge.json \
                    fdmu_schema_columns.json README.txt
            git commit -m "Автооновлення бази ФДМУ $(date +%d.%m.%Y)"
            git push
          else
            echo "Змін немає"
          fi
